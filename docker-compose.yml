# Shared Nostr relay -- ALWAYS-ON, cross-avatar. Provisioned by the operator, NOT tied
# to any one avatar's launch. It is the store-and-forward buffer: it holds messages
# until each recipient fetches them.
#
# gated-relay (relay/): closed in BOTH directions. Every connection must sign in
# (NIP-42) with a key on config.toml's pubkey_whitelist before it may publish or read,
# and a key reads only events it wrote or that name it. That is what lets the same
# relay sit on a public address -- see docker-compose.public.yml.
#
# Bring up ONCE on the host, from this repo:
#   docker compose up -d --build
# It creates the shared external network `nostr-mailbox-net` that local avatars join.
services:
  # One-shot, as root, before every relay start: hand the db volume to the relay's uid.
  # A volume keeps the owner it was first created with, so one inherited from
  # nostr-rs-relay (uid 1000) left the relay crash-looping on "unable to open database
  # file". Top directory only: files already in it keep their owner.
  relay-db-owner:
    build: ./relay
    image: nunet-gated-relay:local
    user: "0"
    entrypoint: ["chown", "10001", "/usr/src/app/db"]
    volumes:
      - relay-db:/usr/src/app/db
    network_mode: none
    restart: "no"

  nostr-relay:
    build: ./relay
    image: nunet-gated-relay:local
    container_name: nostr-relay
    init: true
    volumes:
      # Read-only, and re-read on change: sync-allowlist edits it, no restart needed.
      - ./config.toml:/usr/src/app/config.toml:ro
      - relay-db:/usr/src/app/db
    restart: unless-stopped
    depends_on:
      relay-db-owner:
        condition: service_completed_successfully
    networks:
      - relay

volumes:
  relay-db:
    name: nostr-mailbox-relay-db

networks:
  relay:
    name: nostr-mailbox-net
