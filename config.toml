# nostr-rs-relay -- CLOSED internal relay for the avatar mailbox fabric.
# Reference: https://github.com/scsibug/nostr-rs-relay/blob/master/config.toml

[info]
name = "nunet-avatar-mailbox"
description = "Internal store-and-forward relay for NuNet avatar messaging (closed set)."
# pubkey/contact optional.

[database]
engine = "sqlite"
data_directory = "/usr/src/app/db"

[network]
address = "0.0.0.0"
port = 8080

[options]
reject_future_seconds = 1800

[limits]
# Small closed set; keep generous but bounded.
messages_per_sec = 50
max_event_bytes = 131072      # 128 KiB message bodies
max_ws_message_bytes = 262144
max_ws_frame_bytes = 262144

[authorization]
# CLOSED SET: only accept events signed by known avatar pubkeys. avatar-builder fills this
# with every avatar's minted pubkey_hex (same values as registry.json pubkey_hex). An
# empty/absent list accepts all — do NOT ship empty for the shared relay.
pubkey_whitelist = [
  "7bf8e46df4eec235c59583175982ce2611511e3a85af72529bd1e78d2392e009",  # undergryd-software-engineer
  "a04034fbd0c32b9360d945d6f43f1212127d09bc51eb4226782c1ddd064f70d4",  # avatar-builder
]
