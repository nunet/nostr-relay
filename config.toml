# gated-relay (relay/) -- the CLOSED relay for the avatar mailbox fabric. Closed both
# ways: a connection must sign in (NIP-42) with a key below to publish OR read, and a
# key reads only events it wrote or that name it. The file is re-read when it changes.
# (The layout is nostr-rs-relay's, which this replaced; sections it does not read, like
# [database], are kept so the file stays valid for either.)

[info]
name = "nunet-avatar-mailbox"
description = "Internal store-and-forward relay for NuNet avatar messaging (closed set)."
# pubkey/contact optional.

[database]
engine = "sqlite"
data_directory = "/usr/src/app/db"

[network]
address = "0.0.0.0"
port = 8080

[options]
reject_future_seconds = 1800

[limits]
# Small closed set; keep generous but bounded.
messages_per_sec = 50
max_event_bytes = 131072      # 128 KiB message bodies
max_ws_message_bytes = 262144
max_ws_frame_bytes = 262144

[gate]
# The relay URLs a client may name when it signs in (NIP-42's `relay` tag). A client
# names the URL it dialled, so list every one this relay is reached by: the internal
# name local avatars use, and -- on a public deployment -- wss://<RELAY_DOMAIN>.
relay_urls = [
  "ws://nostr-relay:8080",
]

[authorization]
# CLOSED SET: only these keys may sign in -- to publish or to read. scripts/sync-allowlist
# (via `./fleet mailbox publish`) fills it from pass. An empty list admits NOBODY, and an
# edit takes effect without a restart.
pubkey_whitelist = [
