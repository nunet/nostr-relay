# The public deployment: the same relay, behind Caddy for TLS on a real hostname.
#
#   RELAY_DOMAIN=relay.example.org docker compose \
#       -f docker-compose.yml -f docker-compose.public.yml up -d --build
#
# Caddy obtains and renews the certificate itself (ports 80 and 443 must reach this
# host -- the HTTP-01 challenge needs 80). A DDNS hostname works like any other.
# Avatars then use  NOSTR_MAILBOX_RELAY=wss://$RELAY_DOMAIN , and config.toml's
# [gate] relay_urls must list that URL, or every sign-in is refused.
services:
  caddy:
    image: caddy:2.8.4
    container_name: nostr-relay-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN to the relay's public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [relay]
    depends_on: [nostr-relay]

volumes:
  caddy-data:
    name: nostr-relay-caddy-data
