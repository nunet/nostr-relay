# The public deployment: the same relay, behind Caddy for TLS on a real hostname.
#
#   RELAY_DOMAIN=relay.example.org docker compose \
#       -f docker-compose.yml -f docker-compose.public.yml up -d --build
#
# Caddy obtains and renews the certificate itself over 443 alone (TLS-ALPN-01 challenge,
# see the Caddyfile); port 80 is not published, so nothing on the host answers plain HTTP.
# A DDNS hostname works like any other.
# Avatars then use  NOSTR_MAILBOX_RELAY=wss://$RELAY_DOMAIN , and config.toml's
# [gate] relay_urls must list that URL, or every sign-in is refused.
services:
  caddy:
    image: caddy:2.8.4
    container_name: nostr-relay-caddy
    restart: unless-stopped
    ports: ["443:443"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN to the relay's public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      # the deploy workflow's state directory (deployed.json); DEPLOY_STATE_DIR is exported by the deploy
      - ${DEPLOY_STATE_DIR:-./deploy-state}:/srv/deploy:ro
    # omegahive-proxy: Caddy and the omega hive only, nothing else may join (the hive treats a request without a
    # proxy header as local; omegahive-deploy's cutover.sh refuses a third container). The hive's compose
    # declares it external.
    networks: [relay, omegahive-proxy]
    depends_on: [nostr-relay]

volumes:
  caddy-data:
    name: nostr-relay-caddy-data

networks:
  omegahive-proxy:
    name: omegahive-proxy
